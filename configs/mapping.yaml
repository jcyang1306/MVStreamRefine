# P5 object-centric mapping configuration. Voxel size is a representation setting, not an
# accuracy claim. Real P3/P4 poses currently authorize provisional diagnostics only.

tsdf:
  voxel_length_m: 0.003
  sdf_trunc_m: 0.015
  depth_trunc_m: 0.60
  color: true

commit:
  min_geometry_points: 200
  min_overlap: 0.15
  max_rmse_m: 0.012
  require_pose_version_match: true

output:
  min_point_count: 100
  write_mesh: true
  write_pointcloud: true

benchmark:
  max_keyframes: 64
  heldout_stride: 5
  surface_sample_points: 5000

gate:
  max_tracking_translation_p95_mm: 15.0
  max_tracking_rotation_p95_deg: 3.0
  min_fused_keyframes: 2
  min_geometry_points: 1000
  max_heldout_residual_p95_mm: 10.0
  min_heldout_coverage: 0.70
  min_wrong_extrinsic_error_ratio: 1.50
