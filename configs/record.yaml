# `mvsr record` configuration (subplans/00_FOUNDATION.md F5).
# Each value: unit, source, failure behaviour. PLACEHOLDER = not yet measured on the rig;
# revise after the first I-P0 sessions (inspect-session reports the measured values).

cameras:
  wrist:
    # Intel RealSense D405 on the RM65 wrist (MASTER_PLAN.md hardware, confirmed 2026-10-27).
    serial: "323622271240"        # recording refuses to start if the opened device differs
    width: 1280                   # px, registered color resolution
    height: 720                   # px
    fps: 30                       # Hz; CLI --wrist-fps overrides
    color_format: bgr8            # device stream format (V1-proven on this D405); PNG stores RGB
    depth_units_m: 1.0e-4         # m per raw unit (ADR-0003); start fails if SDK differs (rtol 1e-6)
    writer_threads: 3             # PNG encode+write workers for this stream
  head:
    # Fixed RealSense D435 (ADR-0007): optional stream, recorded only, unverified extrinsic.
    serial: "244622070961"
    width: 1280
    height: 720
    fps: 15                       # Hz default when enabled (ADR-0007 disk budget); --head-fps overrides
    color_format: rgb8            # bgr8 does not stream at 1280x720 on this D435 (V1 capture.yaml)
    depth_units_m: 1.0e-3
    writer_threads: 2

capture:
  warmup_frames: 30               # framesets discarded per camera before START (auto-exposure settle)
  first_frame_timeout_ms: 15000   # V1: the first frame of a second RealSense can take > 5 s
  frame_timeout_ms: 1000          # per wait; a timeout is not a frame (no frame_id is assigned)
  max_consecutive_timeouts: 3     # exceeded -> camera treated as disconnected, session ABORTED
  process_queue_size: 4           # framesets waiting for align+copy per camera; full -> DROPPED_QUEUE_FULL
  writer_queue_size: 48           # aligned frames waiting for PNG write per camera (~1.6 s @30 fps,
                                  # ~220 MB RAM); full -> DROPPED_QUEUE_FULL
  png_compression: 1              # zlib level, lossless (ADR-0003 "fast compression")
  fsync_images: true              # fsync each PNG before rename (atomic + durable)

robot:
  ip: 192.168.1.19                # RM65 controller (MASTER_PLAN.md)
  port: 8080
  source: poll                    # poll | udp; udp reconfigures the controller push target
                                  # (restored on exit) and is unverified on this controller
  poll_hz: 100                    # request rate; measured Hz is reported, not a P0 pass criterion
  udp_port: 8089                  # host UDP port for push mode (RealMan default)
  udp_cycle_5ms_units: 2          # push period in 5 ms units (RealMan protocol) -> 100 Hz; verify on rig
  udp_host_ip: null               # null = interface routing to the controller
  abort_after_failure_s: 5.0      # continuous read failures longer than this -> session ABORTED
  poll_retries: 3                 # extra rm_get_current_arm_state attempts on ret=-1/-2 (timeout)
  poll_retry_delay_s: 0.02        # wait between those attempts

handeye:
  # Reference 2026-10-28 (ADR-0007 amendment): cam2toeef -> wrist_cam2, cam1tobase -> base_cam1,
  # from configs/handeye/calibration_result.json. Checksum mismatch -> recording refused.
  # 2026-10-12 file remains for sessions that already copied it.
  path: configs/handeye/handeye_tf_20261028.txt
  sha256: 2b60289b9b68c62b08d40eddc0a06232249c152d12ec1687639e6c2d974d0ef3

disk:
  reserve_gb: 20.0                # refuse to start if free < this; stop COMPLETE when reached during capture.
                                  # operator-stopped takes (--duration omitted) are not pre-charged for 10 min
  est_bytes_per_frame:            # PLACEHOLDER from ADR-0003 (3-4 MB per 1280x720 RGB-D PNG pair)
    wrist: 3.5e+6                 # bytes; YAML 1.1 needs the exponent sign (3.5e6 is a string)
    head: 3.5e+6
  check_interval_s: 1.0           # free-space polling period during recording

monitor:
  status_interval_s: 5.0          # console status line period
  preview_max_width: 1600         # px, preview window width (wrist+head side by side)
