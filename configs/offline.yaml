dataset:
  root: "./data"
  layout: "current_flat"
  # Logical camera name is "cam"; existing files retain the physical "wrist" prefix.
  cam_prefix: "wrist"
  frame_count_expected: 113
  pose_source: "JointStates.txt"
  # 已由采集端确认（2026-08-19）：
  # 7D pose = x, y, z, qx, qy, qz, qw，表示机械臂 TCP 在 base 系下的位姿。
  pose_semantics: "T_base_tcp"
  quaternion_order: "xyzw"
  # handeye_tf.txt 保留物理标签 wrist_cam2，其矩阵语义为 T_tcp_cam。
  # WORLD = robot base，因此 T_world_cam = T_base_tcp @ T_tcp_cam。
  # 文件中的 legacy base_cam1 块会被忽略。
  handeye_convention: "wrist_cam2=T_tcp_cam"

world_frame: "robot_base"

devices:
  sam2: "cuda"
  tsdf: "CPU:0"

depth:
  # 采集端 save_depth 将米 ×1000 存为 uint16 PNG，即毫米。
  scale: 1000.0
  min_m: 0.15
  max_m: 1.2

mask:
  source: "cache"
  erosion_px: 3
  min_area_px: 1000

sam2:
  enabled: true
  checkpoint: "/models/sam2.1_hiera_tiny.pt"
  model_type: "tiny"
  mode: "video"
  object_id: 1
  prompt_type: "box"
  staging_root: "./output/sam2_frames"
  run_streams_sequentially: true
  offload_video_to_cpu: true
  offload_state_to_cpu: false
  cache_masks: true

keyframe:
  translation_m: 0.02
  rotation_deg: 5.0
  min_mask_area_px: 1000
  min_valid_depth_ratio: 0.7

tsdf:
  device: "CPU:0"
  voxel_size_m: 0.002
  block_resolution: 16
  block_count: 50000
  trunc_voxel_multiplier: 4.0
  depth_max_m: 1.2
  weight_threshold: 3.0

# Task 9：逐 cam 关键帧 point-to-plane ICP 精配准（robot pose 为初值与回退）。
# 默认关闭；先用 --icp true / --icp false 做 A/B，确认改善后再改 enabled。
icp:
  enabled: false
  max_correspondence_distance_m: 0.01
  min_fitness: 0.4
  max_rmse_m: 0.008
  max_translation_correction_m: 0.02
  max_rotation_correction_deg: 5.0
  voxel_downsample_m: 0.004
  max_iterations: 30

visualization:
  enabled: true
  update_every_keyframes: 5

output:
  root: "./output"
  save_keyframes: true
  save_debug: true
