# MVStreamRefine V2 services (ADR-0006).
#
#   docker compose build dev rig
#   docker compose run --rm dev tools/check.sh          # lint + types + tests
#   docker compose run --rm dev mvsr verify-session <session_id>
#
# Recording on the rig (USB + host network for RM65 at 192.168.1.19 + X11 preview):
#   xhost +si:localuser:$USER
#   docker compose run --rm rig mvsr record --object <name> --gt constant_T_base_obj
#   Preview is on by default (Q/ESC stop). Pass --no-preview for headless.
#
# Containers run as the host user so session files are not root-owned. UID/GID
# default to 1000 (hkclr_user on CW20175); export UID GID to override.
# The V1 reference is mounted read-only at /v1 (MVSR_V1_ROOT); its symlink target
# is resolved by the Docker daemon on the host.

services:
  dev:
    build:
      context: .
      target: dev
    image: mvsr:cu121
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    environment:
      MVSR_DATA_ROOT: /workspace/data
      MVSR_V1_ROOT: /v1
      HOME: /tmp
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    shm_size: "4gb"
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ${MVSR_V1_HOST_ROOT:-./ref/MVStreamRefine}:/v1:ro

  rig:
    build:
      context: .
      target: rig
    image: mvsr:cu121-rig
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    privileged: true
    network_mode: host
    environment:
      MVSR_DATA_ROOT: /workspace/data
      MVSR_V1_ROOT: /v1
      HOME: /tmp
      DISPLAY: ${DISPLAY:-:1}
      QT_X11_NO_MITSHM: "1"
      XAUTHORITY: ${XAUTHORITY}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ${MVSR_V1_HOST_ROOT:-./ref/MVStreamRefine}:/v1:ro
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY}:${XAUTHORITY}:ro
