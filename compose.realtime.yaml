# Overlay for live RealSense + RealMan reconstruction.
# Does not replace compose.yaml: offline tools keep running without USB/X11.
#
#   xhost +si:localuser:root
#   docker compose -f compose.yaml -f compose.realtime.yaml run --rm reconstruction
#   xhost -si:localuser:root
#
# Override the default command when needed, e.g. --no-viewer or pytest.
# Dockerfile installs pyrealsense2 and the pinned RealMan SDK; rebuild the
# image after dependency changes.

services:
  reconstruction:
    privileged: true
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/bus/usb:/dev/bus/usb
      - ./tools:/workspace/tools:ro
      - ./src/object_reconstruction:/workspace/src/object_reconstruction:ro
      - ./configs:/workspace/configs:ro
      - ./tests:/workspace/tests:ro
    command:
      - python3
      - tools/run_realtime_reconstruction.py
      - --config
      - configs/realtime.yaml
