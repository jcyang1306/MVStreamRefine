[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam2-inference"
version = "0.1.0"
description = "Self-contained minimal SAM 2.1 image, video, and streaming inference"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE_cctorch"]
dependencies = [
  "hydra-core>=1.3.2",
  "iopath>=0.1.10",
  "numpy>=1.24.4",
  "pillow>=9.4.0",
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "tqdm>=4.66.1",
]

[project.optional-dependencies]
video = ["eva-decord>=0.6.1"]
hf = ["huggingface-hub>=0.23"]
test = ["build>=1.2", "pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sam2 = ["configs/**/*.yaml", "csrc/*.cu"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "checkpoint: requires SAM2_CHECKPOINT and performs real model inference",
]
